[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -s -v
log_cli = true
log_cli_level = WARNING
markers =
    unit: fast unit tests (no audio I/O)
    audio: tests that synthesize or transcribe audio (slower)
    e2e: full end-to-end call tests (slowest)
